name: Build Cinejoy Android TV

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-android-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android TV APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cinejoy-TV-Android14-v1.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-tv-android14-v1.5
          path: Cinejoy-TV-Android14-v1.5.apk
